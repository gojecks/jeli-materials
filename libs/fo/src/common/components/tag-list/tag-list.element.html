<div class="searchWrapper">
  <j-fragment *if="!hideTextBox">
    <input type="search" attr-placeholder="placeholder||'Enter Value'" class="form-control rounded-0"
       {class}="cbClass || ''" @keyup="onAutoCompleteValueChange.next($event.target.value)">
    <div class="list-group searchResultsContainer" @click-delegate:a="onSelectOption(result)">
      <a *for="result of autoCompleteResult" class="list-group-item list-group-item-action">
        <j-place selector="#tagItems" fallback="tagItems" context="$this"></j-place>
      </a>
      <j-template #tagItems>
        <img loading="lazy" decoding="async" *if="result.image" attr-src="result.image" class="thumbnail rounded-circle me-3">
        <span>${:(result.name || result) | capitalize}</span>
      </j-template>
    </div>
    <div class="clearfix tags my-3" @click-delegate:span="onSelectOption(tag, true)" *if="defaultList.length">
      <div class="float-start mt-2 me-2 border p-1 px-2 rounded text-bg-light" *for="tag of defaultList; idx=index">
        <j-place selector="#tagLabel" fallback="tagLabel" context="$this"></j-place> <span class="ms-2 d-inline bi bi-plus-lg"></span>
      </div>
    </div>
  </j-fragment>
  <div class="clearfix tags" @click-delegate:span="removeTag(idx)">
    <div class="float-start mt-2 me-2 border p-1 px-2 rounded text-bg-light" *for="tag of _selectedTags; idx=index">
      <j-place selector="#tagLabel" fallback="tagLabel" context="$this"></j-place> <span class="ms-2 d-inline bi bi-x-lg"></span>
    </div>
    <div class="col-sm-12 text-center" *if="!_selectedTags.length && noMatchFound">No match found.</div>
  </div>
  <j-place></j-place>
</div>

<j-template #tagLabel>
  ${:(tag.name || tag)}
</j-template>
